# Builds the Windows installers and publishes a GitHub release when a version
# tag (v1.2.3) is pushed. The release carries latest.json, which the app's
# auto-updater reads from releases/latest/download/latest.json.
#
# Needs one repository secret: TAURI_SIGNING_PRIVATE_KEY (the updater signing
# key; scripts/release.ps1 sets it the first time). This is NOT a code-signing
# certificate: the installers are unsigned, see README "SmartScreen".
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

  release:
    needs: test
    # Only a version tag publishes, so no branch build is ever signed and released.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: .
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: AveeCare QuickBooks Connector ${{ github.ref_name }}
          releaseBody: |
            Download **AveeCare QuickBooks Connector_x.y.z_x64-setup.exe** and run it on the computer where QuickBooks Desktop is installed.

            Windows may say "Windows protected your PC" because this installer is not yet code-signed. Choose **More info**, then **Run anyway**.

            Already installed? The Connector installs this version by itself the next time it opens.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
